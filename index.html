<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#2755A3" />
<title>NarcoLocker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232755A3'/%3E%3Cpath d='M16 6l8 3v6c0 5-3.4 8.4-8 10-4.6-1.6-8-5-8-10V9z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E" />
<style>
  :root{
    --navy:#2755A3; --navy2:#173F7A; --bg:#F3F7FC; --soft:#EAF0FA;
    --border:#D9E2EC; --muted:#6B7280; --saffron:#FF9933; --green:#138808;
    --bezel:#0B1220;
    --font:"Inter","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:var(--font);background:var(--bg);color:#333;overflow:hidden}
  body{background:radial-gradient(1200px 600px at 50% 0%,#E3ECF8 0%,var(--bg) 60%)}

  /* ── top bar ── */
  .topbar{position:fixed;top:0;left:0;right:0;height:64px;z-index:10;background:#fff;
    border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px}
  .topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;
    background:linear-gradient(90deg,var(--saffron) 0 33.33%,#fff 33.33% 66.66%,var(--green) 66.66% 100%);
    box-shadow:inset 0 -1px 0 rgba(0,0,0,.04)}
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .brand-mark{width:34px;height:34px;border-radius:8px;background:var(--navy);display:grid;place-items:center;flex:none}
  .brand-name{font-size:17px;font-weight:700;color:var(--navy2);letter-spacing:-.02em;line-height:1.15}
  .brand-sub{font-size:11px;color:var(--muted);margin-top:1px;white-space:nowrap}

  .toggle{display:flex;gap:3px;padding:3px;background:var(--soft);border:1px solid var(--border);border-radius:11px}
  .toggle button{all:unset;cursor:pointer;display:flex;align-items:center;gap:7px;height:34px;padding:0 14px;
    border-radius:8px;font:600 13px var(--font);color:var(--muted);transition:background .18s,color .18s}
  .toggle button:hover{color:var(--navy2)}
  .toggle button[aria-pressed="true"]{background:var(--navy);color:#fff;box-shadow:0 1px 3px rgba(23,63,122,.3)}
  .toggle button:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}
  .toggle svg{flex:none}

  /* ── stage ── */
  .stage{position:fixed;top:64px;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;
    overflow:auto;transition:opacity .18s}
  .stage.switching{opacity:0}
  .scaler{position:relative;flex:none}

  /* ── device (mobile mode) ── */
  .device{position:relative;width:414px;height:798px;padding:12px;border-radius:56px;
    background:linear-gradient(145deg,#1d2636,#0a101c);
    box-shadow:0 0 0 1px #2c3648,0 0 0 2px rgba(0,0,0,.5),0 34px 70px rgba(23,63,122,.30),0 8px 20px rgba(0,0,0,.18);
    transform-origin:top left;display:flex;flex-direction:column}
  .btn-side{position:absolute;background:#1d2636;width:3px;border-radius:2px}
  .btn-side.vol1{left:-3px;top:150px;height:52px}
  .btn-side.vol2{left:-3px;top:214px;height:52px}
  .btn-side.pwr{right:-3px;top:190px;height:80px}

  .statusbar{height:32px;background:var(--bezel);border-radius:44px 44px 0 0;color:#fff;position:relative;
    display:flex;align-items:center;justify-content:space-between;padding:0 28px;font:600 12.5px var(--font);flex:none}
  .island{position:absolute;left:50%;top:5px;transform:translateX(-50%);width:92px;height:22px;border-radius:14px;background:#000}
  .sb-right{display:flex;align-items:center;gap:6px}

  .screen{position:relative;width:390px;height:720px;background:var(--bg);overflow:hidden;flex:none}
  .screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:var(--bg)}

  .homebar{height:22px;background:var(--bezel);border-radius:0 0 44px 44px;display:flex;align-items:center;justify-content:center;flex:none}
  .homebar span{width:118px;height:4px;border-radius:3px;background:rgba(255,255,255,.55)}

  /* loader */
  .loader{position:absolute;inset:0;z-index:2;background:var(--bg);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;color:var(--navy2);font:600 13px var(--font);transition:opacity .35s}
  .loader.done{opacity:0;pointer-events:none}
  .loader.err{gap:8px;padding:24px;text-align:center;color:#D64545}
  .loader.err span{font-weight:500;color:#333;line-height:1.5;font-size:12.5px}
  .note{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:20;max-width:92vw;background:#FFF1DE;color:#B8720A;
    border:1px solid #F0DBB4;border-radius:10px;padding:9px 14px;font:600 12.5px var(--font);display:none;text-align:center}
  .spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--navy);animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ── desktop mode ── */
  body.mode-desktop .stage{display:block;overflow:hidden}
  body.mode-desktop .scaler{width:100%!important;height:100%!important}
  body.mode-desktop .device{width:100%;height:100%;padding:0;border-radius:0;background:none;box-shadow:none;transform:none!important}
  body.mode-desktop .statusbar,body.mode-desktop .homebar,body.mode-desktop .btn-side{display:none}
  body.mode-desktop .screen{width:100%;height:100%}

  /* ── real phones: show the app full-screen, no frame ── */
  body.is-phone .topbar{display:none}
  body.is-phone .stage{top:0;display:block;overflow:hidden}
  body.is-phone .scaler{width:100%!important;height:100%!important}
  body.is-phone .device{width:100%;height:100%;padding:0;border-radius:0;background:none;box-shadow:none;transform:none!important}
  body.is-phone .statusbar,body.is-phone .homebar,body.is-phone .btn-side{display:none}
  body.is-phone .screen{width:100%;height:100%}

  @media (max-width:760px){ .brand-sub{display:none} .toggle button span{display:none} .toggle button{padding:0 12px} }
</style>
</head>

          <svg width="16" height="12" viewBox="0 0 24 18" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M2 6.5a15 15 0 0 1 20 0"/><path d="M5.5 10.5a10 10 0 0 1 13 0"/><path d="M9 14.5a5 5 0 0 1 6 0"/></svg>

<script>
(function () {
  var FW = 414, FH = 798;              // device outer size at 100%
  var body = document.body, stage = document.getElementById('stage');
  var scaler = document.getElementById('scaler'), device = document.getElementById('device');
    var frame = document.getElementById('app'), loader = document.getElementById('loader');
  var mode = 'mobile';

  // decode the embedded app (UTF-8 safe) and load it into the iframe
  var bin = atob(APP_B64), bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  frame.srcdoc = new TextDecoder('utf-8').decode(bytes);
  var note = document.getElementById('note');
  function fail(msg) {
    loader.classList.remove('done'); loader.classList.add('err');
    loader.innerHTML = '<b>NarcoLocker could not start</b><span>' + msg + '</span>';
  }
  window.addEventListener('message', function (e) {
    if (e.data && e.data.nlError) fail('Error: ' + e.data.nlError + '<br>Try Chrome or Edge with internet access.');
  });
  frame.addEventListener('load', function () {
    setTimeout(function () { if (!loader.classList.contains('err')) loader.classList.add('done'); }, 700);
    setTimeout(function () {
      try {
        var root = frame.contentDocument.getElementById('root');
        if (!root || !root.children.length) { fail('The app did not render. Open this page in Chrome or Edge with internet access, not inside an embedded preview window.'); return; }
        if (!frame.contentWindow.tailwind) {
          note.textContent = 'Styling did not load — the page needs internet access (cdn.tailwindcss.com).';
          note.style.display = 'block';
        }
      } catch (_) {}
    }, 4000);
  });

  function layout() {
    var phone = window.innerWidth <= 520;
    body.classList.toggle('is-phone', phone);
    body.classList.toggle('mode-desktop', mode === 'desktop');
    body.classList.toggle('mode-mobile', mode === 'mobile');
    if (phone || mode === 'desktop') { scaler.style.width = scaler.style.height = ''; device.style.transform = ''; return; }
    var s = Math.min(1, (window.innerHeight - 64 - 28) / FH, (window.innerWidth - 24) / FW);
    s = Math.max(s, 0.45);
    scaler.style.width = (FW * s) + 'px';
    scaler.style.height = (FH * s) + 'px';
    device.style.transform = 'scale(' + s + ')';
  }

  window.addEventListener('resize', layout);

  layout();

  // live clock in the status bar
  var clock = document.getElementById('clock');
  function tick() {
    var d = new Date(), h = d.getHours() % 12 || 12, m = ('0' + d.getMinutes()).slice(-2);
    clock.textContent = h + ':' + m;
  }
  tick(); setInterval(tick, 20000);
})();
</script>
